
<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

      <title>Litex — 3D World Test</title>

        <style>
            * {
                  margin: 0;
                        padding: 0;
                              box-sizing: border-box;
                                  }

                                      html, body {
                                            width: 100%;
                                                  height: 100%;
                                                        overflow: hidden;
                                                              background: #071522;
                                                                  }

                                                                      #litex-world {
                                                                            width: 100%;
                                                                                  height: 100%;
                                                                                      }

                                                                                          #litex-world canvas {
                                                                                                display: block;
                                                                                                      width: 100%;
                                                                                                            height: 100%;
                                                                                                                }

                                                                                                                    .test-label {
                                                                                                                          position: fixed;
                                                                                                                                top: 20px;
                                                                                                                                      left: 20px;
                                                                                                                                            z-index: 10;
                                                                                                                                                  color: #d5e8f5;
                                                                                                                                                        font: 12px Arial, sans-serif;
                                                                                                                                                              letter-spacing: 2px;
                                                                                                                                                                    text-transform: uppercase;
                                                                                                                                                                        }
                                                                                                                                                                          </style>
                                                                                                                                                                          </head>

                                                                                                                                                                          <body>
                                                                                                                                                                            <div class="test-label">LITEX / WORLD EXPERIMENT 01</div>

                                                                                                                                                                              <div id="litex-world"></div>

                                                                                                                                                                                <script type="module">
                                                                                                                                                                                    import { LitexWorld } from "./src/world/LitexWorld.js";

                                                                                                                                                                                        const container = document.getElementById("litex-world");

                                                                                                                                                                                            const world = new LitexWorld(container);

                                                                                                                                                                                                world.start();

                                                                                                                                                                                                    window.addEventListener("beforeunload", () => {
                                                                                                                                                                                                          world.destroy();
                                                                                                                                                                                                              });
                                                                                                                                                                                                                </script>
                                                                                                                                                                                                                </body>
                                                                                                                                                                                                                </html>
